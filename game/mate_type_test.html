rder-radius:22px;box-shadow:0 4px 9px #00000029;padding:21px 20px 18px}.match-person{display:flex;gap:12px;align-items:center}.match-icon{width:50px;height:50px;border-radius:21px;background:#71D369;display:grid;place-items:center;font-size:29px;flex-shrink:0}.match-person h3{font-size:16px;color:#499D68;margin:0 0 5px}.match-person p{font-size:10px;line-height:1.4;color:#7B8A80;margin:0;white-space:pre-line}.match-code{border-top:1px dashed #d1d1d1;margin-top:18px;padding-top:24px;text-align:center}.match-code p{font-size:10px;white-space:nowrap;color:#79897F;margin:0;font-weight:600}.match-code output{display:block;color:#499D68;font-size:29px;line-height:1.5;font-weight:750;letter-spacing:3px;margin-top:5px}.restart{margin-top:50px;min-height:52px;font-size:18px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:12px}.restart svg{width:20px;height:22px}

/* Match the original type test phone viewport. Long results scroll inside it. */
html,body{height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:22px}
.phone-frame{position:relative;width:min(410px,92vw);height:min(890px,92dvh);flex:none;padding:14px;background:#1b1e1c;border-radius:52px;box-shadow:0 40px 90px -30px rgba(20,30,24,.45)}
.phone-frame:before{content:'';position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#1b1e1c;border-radius:0 0 18px 18px;z-index:20;pointer-events:none}
.phone-frame:after{content:'';position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:3px;background:rgba(31,40,34,.18);z-index:20;pointer-events:none}
.app{width:100%;height:100%;min-height:0;max-width:none;margin:0;border-radius:38px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;position:relative}
.app::-webkit-scrollbar{display:none}
.intro,.quiz,.loading{min-height:100%;height:auto}
.intro{padding:0 28px;display:flex;align-items:center;justify-content:center;min-height:100%;isolation:isolate}
.intro-content{width:100%;padding:120px 0}
.intro-flower{width:105%;height:auto;aspect-ratio:1;top:-10%;left:-22%;z-index:-1}
.intro-circle{z-index:-1}
.intro-harmony{width:113%;height:auto;aspect-ratio:1;top:auto;bottom:-29%;left:8%;z-index:-1}
.intro-description{margin:30px auto;padding:26px 10px;min-height:100px}
.quiz{padding:45px 14px 40px;display:flex;flex-direction:column}
.quiz-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:35px 12px 25px}
.quiz-nav{padding:0 14px;flex:none}
.question-number{margin-bottom:28px;font-size:36px}
.question{font-size:18px;min-height:100px;padding:22px 12px}
.options{width:100%;margin-top:28px}
.option{padding:18px 16px;font-size:14px}
.result{min-height:100%}
.result-hero{padding-left:42px;padding-right:42px}
.result-heading{margin-left:5px;margin-right:0;font-size:20px}
.result-heading strong{font-size:23px}
.result-heading small{font-size:14px}
.paper{padding-left:28px;padding-right:28px;padding-bottom:42px}
@media(max-height:700px){.intro-content{padding:90px 0}.intro-description{margin:22px auto;padding:22px 8px;min-height:88px}.quiz-body{padding-top:24px}.question-number{margin-bottom:20px}.question{min-height:86px}.options{margin-top:22px;gap:12px}.option{padding:15px 14px}}


/* A single reference-sized composition keeps the artwork and copy in proportion. */
.intro{height:100%;min-height:0;padding:0;display:block;overflow:hidden}
.intro-layout{position:absolute;width:412px;height:892px;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--intro-scale, .85));transform-origin:center;isolation:isolate}
.intro .intro-content{position:absolute;top:286px;left:42px;width:328px;padding:0}
.intro .intro-description{width:274px;min-height:112px;padding:35px 10px;margin:35px auto 36px}
.intro .intro-flower{width:430px;height:430px;top:-100px;left:-128px;aspect-ratio:auto;clip-path:none;transform:rotate(-16deg);z-index:-1}
.intro .intro-circle{width:235px;height:235px;top:-63px;right:-135px;z-index:-1}
.intro .intro-harmony{width:465px;height:465px;top:645px;bottom:auto;left:32px;aspect-ratio:auto;clip-path:none;transform:rotate(15deg);z-index:-1}

/* On phones the device itself is the frame. Desktop keeps the preview mockup. */
@media(max-width:600px),(hover:none) and (pointer:coarse) and (max-width:950px){
 html,body{width:100%;height:100%;padding:0;background:#F7F8FA}
 .phone-frame{width:100%;height:100dvh;padding:0;border-radius:0;background:#F7F8FA;box-shadow:none}
 .phone-frame:before,.phone-frame:after{display:none}
 .app{border-radius:0;height:100%;max-width:none;-webkit-overflow-scrolling:touch}
 .quiz{padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom))}
 .paper{padding-bottom:max(36px,env(safe-area-inset-bottom))}
}

/* Paper hides the rear leg; the clip loop remains in front. */
.result-sheet{position:relative;margin-top:-28px;isolation:isolate}
.result-sheet .paper{margin-top:0;z-index:1}
.paperclip-back{z-index:0;pointer-events:none}
.paperclip-front{z-index:2;pointer-events:none}

/* 결과 화면 폰트 (10-10): 제목·한 줄 소개·"○○ 메이트 유형은..."·"이런 메이트와 잘 맞아요" 카드 전체는
   국민연금체 Bold(700), 제목의 "○○ 메이트 유형"과 PC 코드는 국민연금체 ExtraBold(800).
   굵기를 750처럼 사이값으로 두면 브라우저가 ExtraBold를 골라버리므로 700/800으로 딱 맞춘다. */
.result-heading,.result-heading small,.description-heading,.description-heading span,
.match-heading,.match-card,.match-person h3,.match-person p,.match-code p{font-family:NationalPension,Pretendard,sans-serif;font-weight:700}
.result-heading strong,.match-code output{font-family:NationalPension,Pretendard,sans-serif;font-weight:800}
/* 한 줄 소개: 국민연금체 Regular, "○○ 하는 ○○파" 부분만 Bold. 두 줄은 각각 한 줄로 고정하고
   폰 폭에 맞춰 글자 크기를 자동으로 줄인다(fitTagline). */
.tagline{font-family:NationalPension,Pretendard,sans-serif;font-weight:400;white-space:normal;flex-direction:column}
.tagline b{font-weight:700}
.tagline-line{display:block;white-space:nowrap;width:100%;min-width:0;overflow:hidden}
/* 첫 화면 타이틀 "주거 메이트 매칭 테스트!"만 국민연금체 Regular (위 작은 글씨는 그대로) */
.intro h1{font-family:NationalPension,Pretendard,sans-serif;font-weight:400}
.intro h1 small{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
/* 결과 화면 뒤 심볼 -24도 회전 */
.result-art{transform:rotate(-24deg)}
/* 다시하기 아이콘 (이미지) */
.restart img{width:20px;height:20px;display:block}
.loading h2{margin:34px 0 0}
.loading p{margin:6px 0 0}
.loading h2{font-family:NationalPension,Pretendard,sans-serif;font-weight:700}
.option{white-space:normal;word-break:keep-all;overflow-wrap:break-word}
.option .word{white-space:nowrap}
body,button,input,textarea,select{letter-spacing:0}
.option{line-height:22px}
.result-heading strong{background:linear-gradient(transparent 57%,rgba(255,255,255,.3) 57%);padding:0 5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
</style>

const introViewport=document.querySelector('.app');

new ResizeObserver(fitIntro).observe(introViewport);fitIntro();

  var questions = [

    {

      options:[
        {t:'오늘 하루 있었던 일을 도란도란 나누고\n가볍게 야식도 같이 먹는 사이', score:{H:1}},
        {t:'각자의 프라이버시를 존중하되, 오다가다 마주치면 따뜻하게 인사하는 정도', score:{A:1}},

const results={

const $=id=>document.getElementById(id);let index=0,answers=[],pending=false,timer;
function show(id){['intro','quiz','loading','result'].forEach(v=>$(v).hidden=v!==id);document.querySelector('.app').scrollTop=0;}
function setWords(el,text){el.replaceChildren();text.split('\n').forEach((line,li)=>{if(li)el.appendChild(document.createElement('br'));line.split(' ').filter(Boolean).forEach((w,wi)=>{if(wi)el.appendChild(document.createTextNode(' '));const s=document.createElement('span');s.className='word';s.textContent=w;el.appendChild(s)})})}
function render(){show('quiz');const q=questions[index];$('counter').textContent=(index+1)+'/6';$('number').textContent='Q'+(index+1)+'.';$('question').textContent=q.text;$('fill').style.width=((index+1)/questions.length*100)+'%';$('progress').setAttribute('aria-valuenow',index+1);$('options').replaceChildren();q.options.forEach((opt,i)=>{const button=document.createElement('button');button.className='option';setWords(button,index===0&&i===0?'숨만 쉬어도 나가는 월세,\n생활비 부담이 너무 커':index===0&&i===1?'혼자 사니 밤길도 무섭고\n집안 보안도 걱정돼':opt.t);button.onclick=()=>choose(i);$('options').appendChild(button)});pending=false;$('back').disabled=false;$('question').focus({preventScroll:true});}
function choose(i){if(pending)return;pending=true;answers[index]=i;Array.from($('options').children).forEach((b,j)=>{b.disabled=true;b.classList.toggle('selected',j===i)});$('back').disabled=true;timer=setTimeout(()=>{index++;if(index<questions.length)render();else{show('loading');timer=setTimeout(finish,1200)}},280);}
function calculate(){const score={S:0,A:0,H:0};answers.forEach((answer,i)=>{const add=questions[i].options[answer].score||{};Object.keys(add).forEach(k=>score[k]+=add[k])});return Object.keys(score).reduce((a,b)=>score[b]>score[a]?b:a,'S');}
const TAGLINE_BOLD={S:'깔끔한 1/N을 지향하는 실속파',A:'약속을 철저히 지키는 원칙주의자',H:'일상의 소소한 온기를 나누는 낭만파'};
function renderTagline(el,text,bold){el.replaceChildren();text.split('\n').forEach(line=>{const row=document.createElement('span');row.className='tagline-line';const i=bold?line.indexOf(bold):-1;if(i<0){row.textContent=line}else{const b=document.createElement('b');b.textContent=bold;row.append(line.slice(0,i),b,line.slice(i+bold.length))}el.appendChild(row)});fitTagline(el);if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('400 14px NationalPension'),document.fonts.load('700 14px NationalPension')]).then(()=>fitTagline(el)).catch(()=>{})}}
function fitTagline(el){el.style.fontSize='';let size=parseFloat(getComputedStyle(el).fontSize)||14;const rows=[...el.querySelectorAll('.tagline-line')];while(size>9&&rows.some(r=>r.scrollWidth>r.clientWidth+0.5)){size-=0.25;el.style.fontSize=size+'px'}}
window.addEventListener('resize',()=>{const el=$('tagline');if(el&&el.querySelector('.tagline-line'))fitTagline(el)});
function finish(){const type=calculate(),r=results[type];$('result').dataset.type=type;$('prefix').textContent=r.prefix;$('typeName').textContent=r.name+' 메이트 유형';renderTagline($('tagline'),r.tagline,TAGLINE_BOLD[type]);$('descriptionHeading').textContent=r.name+' 메이트 유형은...';$('description').textContent=r.description;$('traits').replaceChildren();r.traits.forEach(text=>{const li=document.createElement('li');li.textContent=text;$('traits').appendChild(li)});$('mateName').textContent=r.mate;$('mateIcon').textContent=r.icon;$('mateDescription').textContent=r.mateDescription;$('resultArt').innerHTML=type==='S'?'<circle cx="100" cy="100" r="100" fill="url(#pink)"/>':'<use href="#'+(type==='A'?'pink-harmony':'connection')+'"/>';pending=false;show('result');try{parent.postMessage({teum:'typeResult',type:type,code:r.code,name:r.name},'*')}catch(e){}$('resultHeading').focus({preventScroll:true});}
$('start').onclick=()=>{index=0;answers=[];render()};$('back').onclick=()=>{if(pending)return;answers.length=index;if(index>0){index--;render()}else show('intro')};$('restart').onclick=()=>{try{parent.postMessage({teum:'typeReset'},'*')}catch(e){}clearTimeout(timer);index=0;answers=[];pending=false;show('intro');$('start').focus({preventScroll:true})};
})();
