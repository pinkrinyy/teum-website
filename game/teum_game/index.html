<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>틈새살이</title>
<style>
  html,body{ margin:0; height:100%; overflow:hidden; background:#F7F8FA; }
  #game{ position:absolute; left:50%; top:50%; border:0; transform-origin:0 0; }
</style>
</head>
<body>
<!-- 게임 본체는 game.html. 창이 PC 최소 크기(1280x720)보다 작으면 게임은 그 크기 이상으로 그려 두고 통째로 비율대로 줄여 보여준다 -->
<iframe id="game" title="틈새살이" allow="fullscreen"></iframe>
<script>
  var MIN_W = 1280, MIN_H = 720;
  var MAX_H_RATIO = 0.8;    // 세로가 가로의 0.8배(5:4)보다 길면 더 늘리지 않고 위아래를 비운다
  var MAX_W_RATIO = 21 / 9; // 가로가 울트라와이드(21:9)보다 넓으면 더 늘리지 않고 좌우를 비운다
  var game = document.getElementById('game');
  game.src = 'game.html' + location.search + location.hash;
  function fit(){
    var W = innerWidth, H = innerHeight;
    var s = Math.min(1, W / MIN_W, H / MIN_H);
    var h = Math.min(H / s, W / s * MAX_H_RATIO);
    var w = Math.min(W / s, h * MAX_W_RATIO);
    game.style.width = w + 'px';
    game.style.height = h + 'px';
    game.style.transform = 'scale(' + s + ') translate(-50%, -50%)';
  }
  addEventListener('resize', fit);
  fit();
  game.addEventListener('load', function(){ game.focus(); }); // 키보드 단축키가 바로 먹게
</script>
</body>
</html>
